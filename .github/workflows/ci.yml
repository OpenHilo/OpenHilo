name: Core validation
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [ 22, 24 ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build:packages
      - run: npm run test:types
      - run: npm run check:boundaries
      - run: npm run check:packages -- --pack
      - run: npm run check:notices
      # Packages were built above; call the runner directly so pretest:offline does not rebuild.
      - run: node scripts/test-offline.cjs
      - run: npm run check:consumers
