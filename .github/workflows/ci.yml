name: Core validation
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  offline:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest ]
        node: [ 22, 24 ]
        include:
          - os: macos-latest
            node: 24
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build:packages
      - run: npm run test:types
      - run: npm run check:boundaries
      - run: npm run check:packages -- --pack
      - run: npm run check:notices
      # Packages were built above; call the runner directly so pretest:offline does not rebuild.
      - run: node scripts/test-offline.cjs
      # macOS ships Bash 3.2 as /bin/bash; runner images may put a newer Bash first on PATH.
      - if: runner.os == 'macOS'
        run: PATH="/usr/bin:/bin:/usr/sbin:/sbin:$(dirname "$(command -v node)")" node --test adapters/code-local/test/*.cjs
      - run: npm run check:consumers
